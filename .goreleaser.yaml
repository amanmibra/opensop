# GoReleaser config for the opensop binary. Releases run from .github/workflows/release.yml
# when a v* tag is pushed. Try it locally without publishing:
#
#   goreleaser release --snapshot --clean     # builds every archive into dist/
#
# Archive names carry no version (opensop_<os>_<arch>.tar.gz) so install.sh can use
# GitHub's releases/latest/download/<name> URL.
version: 2

project_name: opensop

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: opensop
    main: ./cmd/opensop
    binary: opensop
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w"]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: opensop
    ids: [opensop]
    name_template: "opensop_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - FORMAT.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  draft: true # review the notes and assets, then publish by hand
  prerelease: auto
