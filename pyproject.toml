[project]
name = "sopkit"
version = "0.1.0"
description = "Modular, git-versioned instructions for task-driven agents."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "pyyaml>=6.0",
]

[project.scripts]
sopkit = "sopkit.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sopkit"]

[tool.hatch.build.targets.wheel.force-include]
"FORMAT.md" = "sopkit/FORMAT.md"
"skills" = "sopkit/skills"

[tool.pytest.ini_options]
testpaths = ["tests"]
