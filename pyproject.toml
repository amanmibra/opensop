[project]
name = "opensop"
version = "0.0.2"
description = "Modular, git-versioned instructions for teams managing multiple task-driven agents."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.8",
    "pyyaml>=6.0",
]

[project.scripts]
opensop = "opensop.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opensop"]

[tool.hatch.build.targets.wheel.force-include]
"FORMAT.md" = "opensop/FORMAT.md"
"skills" = "opensop/skills"

[tool.pytest.ini_options]
testpaths = ["tests"]
