# Behavior gate: run YOUR agent tests for the agents a pull request changes.
#
# Copy to .github/workflows/ in your repo, then fill in the "Run your tests" step.
#
#   job `detect`  works out which agents to test:
#                   - the agents whose built prompt changed in this PR (`opensop plan --json`)
#                   - or, if none changed (e.g. only test files changed) or the run was started
#                     by hand with no agents given: every agent
#   job `test`    runs your command once, with the agent ids in environment variables
#   job `test-each` (optional, commented out) runs your command once per agent, in parallel
#
# Make the `behavior-gate / test` check required in your branch protection rules to block
# merges when your tests fail.

name: behavior-gate

on:
  pull_request:
    paths:
      - "sops/**"     # your OpenSOP root
      - "tests/**"    # your agent tests (changes here run every agent)
  workflow_dispatch:
    inputs:
      agents:
        description: "Agent ids to test, space-separated (blank = all agents)"
        required: false
        default: ""

env:
  OPENSOP_ROOT: sops
  OPENSOP_VERSION: v0.0.2

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.agents.outputs.ids }}            # "tonys-pizza sakura-sushi"
      refs: ${{ steps.agents.outputs.refs }}          # "livekit:tonys-pizza livekit:sakura-sushi"
      platform_ids: ${{ steps.agents.outputs.platform_ids }}  # "tonys-pizza sakura-sushi" (the platform's own ids)
      matrix: ${{ steps.agents.outputs.matrix }}      # JSON list of {id, platform_ref, platform, platform_id}
      count: ${{ steps.agents.outputs.count }}
      all: ${{ steps.agents.outputs.all }}            # "true" when testing every agent
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the base branch is needed to see what changed

      - uses: astral-sh/setup-uv@v6

      - name: Install OpenSOP
        run: uv tool install "opensop @ git+https://github.com/amanmibra/opensop@${OPENSOP_VERSION}"

      - name: Work out which agents to test
        id: agents
        env:
          BASE_REF: ${{ github.base_ref }}
          REQUESTED: ${{ inputs.agents }}
        run: |
          set -euo pipefail
          opensop agents "$OPENSOP_ROOT" --json > all-agents.json

          if [ -n "${REQUESTED:-}" ]; then
            # Started by hand with specific agents.
            ids="$REQUESTED"
          elif [ -n "${BASE_REF:-}" ]; then
            # Pull request: agents whose built prompt changed (removed agents are skipped).
            opensop plan "$OPENSOP_ROOT" --against "origin/$BASE_REF" --json > plan.json
            ids=$(jq -r '[.changes[] | select(.status != "removed") | .agent] | join(" ")' plan.json)
          else
            ids=""
          fi

          all=false
          if [ -z "$ids" ]; then
            # Nothing specific to test: run every agent.
            ids=$(jq -r 'map(.id) | join(" ")' all-agents.json)
            all=true
          fi

          unknown=$(jq -r --arg ids "$ids" '($ids | split(" ") | map(select(. != ""))) - map(.id) | join(" ")' all-agents.json)
          if [ -n "$unknown" ]; then
            echo "::error::Unknown agent id(s): $unknown. Known: $(jq -r 'map(.id) | join(" ")' all-agents.json)"
            exit 1
          fi

          # Look up each id's platform details, so tests can use whichever id they need.
          jq -c --arg ids "$ids" '($ids | split(" ")) as $want | map(select(.id as $i | $want | index($i)))
                | map({id, platform_ref, platform, platform_id})' all-agents.json > selected.json
          {
            echo "ids=$(jq -r 'map(.id) | join(" ")' selected.json)"
            echo "refs=$(jq -r 'map(.platform_ref) | join(" ")' selected.json)"
            echo "platform_ids=$(jq -r 'map(.platform_id) | join(" ")' selected.json)"
            echo "matrix=$(cat selected.json)"
            echo "count=$(jq length selected.json)"
            echo "all=$all"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Agents to test ($( [ "$all" = true ] && echo "all" || echo "changed in this PR"))"
            jq -r '.[] | "- `\(.id)` (\(.platform_ref))"' selected.json
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    needs: detect
    if: needs.detect.outputs.count != '0'
    runs-on: ubuntu-latest
    env:
      # Pick whichever form your tests take:
      AGENT_IDS: ${{ needs.detect.outputs.ids }}                  # OpenSOP ids: "tonys-pizza sakura-sushi"
      AGENT_REFS: ${{ needs.detect.outputs.refs }}                # "livekit:tonys-pizza livekit:sakura-sushi"
      AGENT_PLATFORM_IDS: ${{ needs.detect.outputs.platform_ids }} # the platform's own ids
      AGENTS_JSON: ${{ needs.detect.outputs.matrix }}             # full details as JSON
      ALL_AGENTS: ${{ needs.detect.outputs.all }}                 # "true" if testing every agent
    steps:
      - uses: actions/checkout@v4

      # Set up whatever your tests need (Node, Python, secrets, ...), e.g.:
      # - uses: actions/setup-node@v4
      #   with: { node-version: 22 }
      # - run: npm ci

      - name: Run your tests
        run: |
          echo "Testing: $AGENT_IDS (all agents: $ALL_AGENTS)"
          # ↓ Replace with your command. Examples:
          #   npm run test:agents -- --agents "$AGENT_IDS"
          #   pytest tests/agents -k "$(echo $AGENT_IDS | sed 's/ / or /g')"
          #   python evals/run_evals.py --base origin/${{ github.base_ref }}   (see examples/braintrust-evals)
          #   for id in $AGENT_IDS; do ./scripts/test-agent.sh "$id"; done
          echo "No test command configured yet" && exit 1

  # Optional: one job per agent, in parallel. Each sees its own agent in matrix.agent.
  # test-each:
  #   needs: detect
  #   if: needs.detect.outputs.count != '0'
  #   runs-on: ubuntu-latest
  #   strategy:
  #     fail-fast: false
  #     matrix:
  #       agent: ${{ fromJSON(needs.detect.outputs.matrix) }}
  #   name: test ${{ matrix.agent.id }}
  #   steps:
  #     - uses: actions/checkout@v4
  #     - run: ./scripts/test-agent.sh "${{ matrix.agent.id }}"   # or matrix.agent.platform_id
