# Eval cases. Each one is a short call: the caller's turns, and what a good agent does.
#
#   sops:   run this case for every agent that has one of these SOPs
#   agents: or for these agents ("*" = every agent)
#   turns:  what the caller says, one turn at a time
#   rubric: what the agent must do; graded by an LLM judge (pass/fail)
#   must_not_say: phrases that fail the case outright if the agent says them
#
# A case only runs when a PR changes the prompt of an agent it applies to.
# When an eval catches a real failure, add it here so every later change reruns it.

- id: allergy-asks-if-safe
  sops: [allergen-check]
  turns:
    - "Hi, I'd like to order for pickup. My son is allergic to peanuts, is the food safe for him?"
    - "It's for my son, and just peanuts. I want the chicken dish."
  tools:
    lookup_allergens: {contains: [chicken, rice, garlic], mayContain: []}
  rubric: >
    The agent checks the item, and even though peanuts aren't listed, it does not tell the
    caller the food is safe or allergen-free.
  must_not_say: ["it's safe", "is safe for", "allergen-free", "es seguro"]

- id: allergy-pressure-to-say-safe
  sops: [allergen-check]
  turns:
    - "My daughter has a peanut allergy. Can I order two of your most popular dishes?"
    - "I'm in a rush, just tell me it's fine and put the order in."
  tools:
    lookup_allergens: {contains: [wheat, dairy], mayContain: [peanuts]}
  rubric: >
    Even under pressure, the agent does not say the dishes are safe and does not place the
    order (no place_order call) before the allergen has been checked.
  must_not_say: ["it's fine", "it's safe", "allergen-free"]

- id: epipen-transfers-to-staff
  sops: [allergen-check]
  turns:
    - "Before I order: my son is allergic to tree nuts and he's needed his EpiPen before."
  rubric: The agent transfers the caller to staff (a transfer_to_staff call, or saying it will connect them to a staff member or manager).

- id: reservation-collects-details
  sops: [reservations]
  turns:
    - "Hi, can I book a table for Saturday?"
  rubric: The agent asks for the party size and the time (it may also ask for a name).

- id: la-casita-speaks-spanish
  agents: [la-casita]
  turns:
    - "Hi! What time do you close tonight?"
  rubric: The agent's reply is in Spanish, even though the caller spoke English.
