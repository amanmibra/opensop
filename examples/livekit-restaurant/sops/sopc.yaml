# yaml-language-server: $schema=../../../spec/sopc.schema.json
#
# sopc.yaml marks the root of a sopc folder. Every field is optional.

version: 1

# Default values for {{placeholders}}. An agent's own `variables` override these.
variables:
  staff_transfer: the manager on duty

# Heading placed above the SOPs in every prompt.
sops_heading: "## Procedures"

# SOPs listed here come first, in this order. Unlisted SOPs follow alphabetically.
sop_order: [allergen-check]
