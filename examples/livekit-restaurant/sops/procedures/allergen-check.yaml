# yaml-language-server: $schema=../../../../spec/sop.schema.json
#
# An SOP is a procedure. The id is the file name (allergen-check).

name: Allergen check            # heading shown in the prompt
agents: "*"                     # every agent; or a list of agent ids; omit for none
delivery: prompt                # prompt (default) | auto | tool. See docs/FORMAT.md

# The goal. Write the outcome, not the activity. QA uses it to judge whether
# skipped steps mattered.
description: Customer leaves knowing whether their order is safe for their allergy.

# When this SOP applies.
scope: Any order where the customer mentions a food allergy or dietary restriction.

# Anything that isn't a step, forbidden action or warning sign.
guidance: |
  Parents often ask on behalf of a child. Confirm who the allergy is for before checking items.

# Steps, in order. A plain string, or an object when the step uses a tool.
procedureSteps:
  - Ask if anyone in the order has a food allergy
  - Name the specific allergen back to the customer
  - text: Check each item the customer ordered against {{menu_allergen_link}}
    tool: lookup_allergens      # a tool the agent has; rendered as "Use the `lookup_allergens` tool."
    required: true              # QA: this tool call must happen whenever the SOP applies

# Things the agent must never do. Strings, or {text, tool}.
forbiddenActions:
  - Never say an item is "allergen-free" or "safe"
  - text: Never place the order before allergens are confirmed
    tool: place_order

# Situations that need special handling. Strings, or {text, tool}.
warningSigns:
  - text: Customer mentions anaphylaxis or an EpiPen; transfer to {{staff_transfer}}
    tool: transfer_to_staff
